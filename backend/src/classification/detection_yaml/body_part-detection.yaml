# =============================================================================
# Body Part Detection Configuration
# =============================================================================
# Version: 3.1.0
# Date: 2026-02-25
#
# Purpose: Multi-category body part detection for neuroimaging classification.
#          Categories are YAML-driven -- add a new body part by adding a
#          block under `categories`. No Python code changes required for
#          simple additions.
#
# Output: body_part: "brain" | "spine" | "neck" | "brain-neck" | null
#
# Resolution order (highest priority wins):
#   spine  >  brain-neck  >  neck  >  brain  >  unknown
#
# Combination rules (hardcoded in detector, not YAML-configurable):
#   spine + anything     -> spine
#   neck  + brain        -> brain-neck
#   neck  only           -> neck
#   brain only           -> brain
#   nothing              -> unknown (null)
#
# Detection approach:
#   - Check text_search_blob for category-specific keywords
#   - Multilingual support (English, Swedish, German, French, Dutch)
#
# Database validated counts (from v2 config):
#   - spine: n=52,308
#   - spine neck: n=43,550
#   - rygg (Swedish): n=10,104
#   - ryggmärg (spinal cord): n=2,105
#   - halsrygg (cervical): n=1,317
#   - Brain only (no spine): n=399,339
# =============================================================================

meta:
  version: "3.1.0"
  description: "Multi-category body part detection for neuroimaging classification"
  field: "body_part"
  output_type: "categorical"

# Default body part when no keywords match.
default_body_part: null

# =============================================================================
# CATEGORIES
# =============================================================================
# Each category defines:
#   triggers_review - Whether detection triggers manual review (bool)
#   review_reason   - Review reason code (string or null)
#   confidence      - Detection confidence for keyword match (float)
#   keywords        - List of lowercase keywords to match in text_search_blob
#
# Note: "brain-neck" is a synthetic category created by the detector when
# both brain AND neck keywords match. It does not need its own keywords.
# =============================================================================

categories:
  # ---------------------------------------------------------------------------
  # NECK
  # ---------------------------------------------------------------------------
  neck:
    triggers_review: true
    review_reason: "bodypart:neck_detected"
    confidence: 0.65
    keywords:
      # English
      - "neck"

      # Swedish
      - "nacke"           # neck
      - "hals"            # neck (also Dutch/German for neck)

      # Dutch
      - "nek"             # neck

      # French
      - "cou"             # neck

  # ---------------------------------------------------------------------------
  # SPINE
  # ---------------------------------------------------------------------------
  spine:
    triggers_review: true
    review_reason: "bodypart:spine_detected"
    confidence: 0.65
    keywords:
      # English - general spine
      - "spine"           # n=52,308
      - "spinal"          # n=996
      - "spinal cord"     # n=2

      # English - specific regions
      - "cervical"        # n=45
      - "thoracic"        # n=30
      - "lumbar"          # n=10
      - "c-spine"         # n=18
      - "t-spine"         # n=26
      - "l-spine"

      # English - anatomy
      - "vertebral"
      - "vertebra"
      - "cord"
      - "medulla"         # n=12

      # Swedish
      - "rygg"            # n=10,104 (back/spine)
      - "ryggm rg"        # n=2,105 (spinal cord - märg normalized)
      - "halsrygg"        # n=1,317 (cervical spine)
      - "br strygg"       # thoracic spine (bröstrygg normalized)
      - "brostrygg"
      - "l ndrygg"        # lumbar spine (ländrygg normalized)
      - "lumbalrygg"

      # German
      - "wirbel"          # vertebra
      - "hws"             # n=14 (Halswirbelsäule - cervical)
      - "bws"             # n=15 (Brustwirbelsäule - thoracic)
      - "lws"             # Lendenwirbelsäule - lumbar
      - "wirbels ule"     # Wirbelsäule - spine

      # French
      - "rachis"          # n=14
      - "cervicale"
      - "dorsale"
      - "lombaire"
      - "moelle"          # spinal cord

      # Dutch
      - "wervelkolom"     # spinal column
      - "ruggengraat"     # spine

      # Pathology indicators (always spinal)
      - "myelit"          # myelitis
      - "myelopathy"
      - "syringomyelia"

  # ---------------------------------------------------------------------------
  # BRAIN
  # ---------------------------------------------------------------------------
  brain:
    triggers_review: false
    review_reason: null
    confidence: 0.65
    keywords:
      # Functional MRI indicators (always brain)
      - "fmri"
      - "bold"
      - "resting state"
      - "rs-fmri"
      - "task-fmri"
      - "rest-fmri"
      - "rsfmri"
      - "rfmri"

      # Brain-specific anatomical terms
      - "hippocampus"
      - "amygdala"
      - "thalamus"
      - "putamen"
      - "caudate"
      - "cortex"
      - "cortical"
      - "subcortical"
      - "white matter"
      - "gray matter"
      - "grey matter"
      - "corpus callosum"
      - "cerebral"
      - "cerebellum"
      - "cerebellar"
      - "frontal"
      - "parietal"
      - "temporal"
      - "occipital"
      - "brainstem"
      - "midbrain"
      - "pons"

      # Brain imaging protocols
      - "brain"
      - "head"
      - "neuro"
      - "hcp"             # Human Connectome Project
      - "adni"            # Alzheimer's Disease Neuroimaging Initiative
      - "abcd"            # ABCD Study (brain development)

      # Swedish
      - "hj rna"          # hjärna (brain, normalized)
      - "hjarna"          # hjärna alternative normalization
      - "huvud"           # head

      # German
      - "kopf"            # head
      - "gehirn"          # brain
      - "hirn"            # brain (colloquial)
      - "sch del"         # Schädel (skull, normalized)
      - "schadel"

      # French
      - "cerveau"         # brain
      - "encephale"       # brain
      - "cr ne"           # crâne (skull, normalized)
      - "crane"

      # Dutch
      - "hersenen"        # brain
      - "hoofd"           # head

  # ---------------------------------------------------------------------------
  # BRAIN-NECK (synthetic)
  # ---------------------------------------------------------------------------
  # This category is assigned automatically when BOTH brain and neck keywords
  # are found. It does not have its own keywords -- the detector creates it
  # from the combination. Listed here for review/export configuration only.
  # ---------------------------------------------------------------------------
  brain-neck:
    triggers_review: true
    review_reason: "bodypart:brain_neck_detected"
    confidence: 0.65
    keywords: []

# =============================================================================
# DETECTION SETTINGS
# =============================================================================

detection:
  field_priority:
    - "text_search_blob"

  # Conflict: spine + brain both found -> spine wins, flag for review
  conflict_triggers_review: true
  conflict_review_reason: "bodypart:conflict"
